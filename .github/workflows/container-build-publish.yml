name: Container Build and Publish

on:
  workflow_call:
    inputs:
      dockerfile:
        description: 'Dockerfile path'
        default: Dockerfile
        type: string
      context:
        description: 'Build context path in the Git repository'
        default: .
        type: string
      image_name:
        description: 'GHCR image name, including the namespace'
        default: ${{ github.repository }}
        type: string

jobs:
  build:
    uses: docker/github-builder/.github/workflows/build.yml@a31d2311da4d55e21b978c1c52bab82ba97d51ee # v1.19.0
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      file: ${{ inputs.dockerfile }}
      context: ${{ inputs.context }}
      output: image
      distribute: true
      fail-fast: true
      platforms: linux/amd64,linux/arm64
      push: ${{ !startsWith(github.event_name, 'pull_request') }}
      sbom: ${{ !startsWith(github.event_name, 'pull_request') }}
      sign: auto
      cache: true
      cache-mode: max
      cache-scope: ${{ inputs.image_name }}
      build-args: SOURCE_DATE_EPOCH=context
      meta-images: ghcr.io/${{ inputs.image_name }}
      meta-flavor: latest=false
      meta-tags: |
        type=ref,event=branch,prefix=${{ github.ref_name == 'latest' && 'branch-' || '' }}
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=semver,pattern={{major}}
        # The metadata helper also returns true for create events on other branches.
        type=raw,value=latest,enable=${{ github.ref_type == 'branch' && github.event_name != 'create' && '{{is_default_branch}}' || 'false' }}
      set-meta-labels: true
      set-meta-annotations: true
      meta-labels: maintainer=OpenStreetMap Contributors
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
